<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management System</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e7;
      --surface: #fffdf8;
      --ink: #293a34;
      --muted: #707a72;
      --line: #dce1d8;
      --green: #3c6856;
      --green-deep: #2b5142;
      --sage: #eaf0e8;
      --clay: #b96850;
      --clay-light: #f6e9e2;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 42px 20px;
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        linear-gradient(135deg, rgba(217, 229, 216, 0.62), transparent 48%),
        var(--paper);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 34px;
      background: var(--surface);
      border: 1px solid rgba(61, 83, 69, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(50, 64, 53, 0.1);
    }
    h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
    }
    h2 {
      margin: 0 0 26px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      font-size: 30px;
    }
    h3 {
      margin: 0 0 14px;
      font-size: 21px;
    }
    #orderForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    .form-group {
      min-width: 0;
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      color: #52645a;
      font-size: 13px;
      font-weight: 650;
    }
    input, select, button {
      width: 100%;
      padding: 11px 12px;
      font: inherit;
    }
    input, select {
      color: var(--ink);
      background: #fffefa;
      border: 1px solid #cfd8ce;
      border-radius: 5px;
    }
    input:focus, select:focus {
      outline: 3px solid rgba(60, 104, 86, 0.16);
      border-color: var(--green);
    }
    #orderForm > button {
      grid-column: 1 / -1;
      margin-top: 2px;
      padding: 12px 16px;
      color: white;
      background: var(--green);
      border: 0;
      border-radius: 5px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }
    #orderForm > button:hover {
      background: var(--green-deep);
      transform: translateY(-1px);
    }
    button:focus-visible {
      outline: 3px solid rgba(185, 104, 80, 0.45);
      outline-offset: 2px;
    }
    .error-msg {
      grid-column: 1 / -1;
      display: none;
      margin-top: 10px;
      color: #9b4939;
      font-size: 14px;
    }
    .summary-box {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0 18px;
      margin-top: 26px;
      padding: 18px 20px;
      background: var(--sage);
      border-left: 3px solid var(--green);
    }
    .summary-box h3 {
      grid-column: 1 / -1;
      margin-bottom: 12px;
    }
    .summary-box p {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .summary-box span {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
    }
    .list-heading {
      margin: 28px 0 12px;
    }
    ul {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 14px;
      background: #fffefa;
      border: 1px solid var(--line);
      border-left: 3px solid #9ab09d;
      border-radius: 5px;
    }
    li.completed {
      background: #f1f5ef;
      border-left-color: var(--green);
    }
    .completed .order-details strong {
      color: var(--muted);
      text-decoration: line-through;
    }
    .item-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }
    .item-actions button {
      width: auto;
      margin: 0;
      padding: 7px 10px;
      color: var(--green-deep);
      background: var(--sage);
      border: 0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .item-actions .btn-delete {
      color: #934d3d;
      background: var(--clay-light);
    }
    .item-actions button:hover {
      filter: brightness(0.96);
    }
    .order-details {
      flex: 1;
      min-width: 0;
    }
    .order-details p {
      margin: 5px 0 0;
    }
    .order-status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
      }
      .container {
        padding: 22px 18px;
      }
      h2 {
        font-size: 26px;
      }
      #orderForm {
        grid-template-columns: 1fr;
      }
      .summary-box {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .summary-box h3 {
        margin-bottom: 0;
      }
      .summary-box p {
        flex-direction: row;
        align-items: baseline;
        justify-content: space-between;
      }
      li {
        align-items: flex-start;
        flex-direction: column;
      }
      .item-actions {
        width: 100%;
      }
      .item-actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Client Order Tracker</h2>
    
    <form id="orderForm">
      <div class="form-group">
        <label for="clientName">Client Name</label>
        <input type="text" id="clientName" required maxlength="80">
      </div>
      <div class="form-group">
        <label for="serviceType">Service Type</label>
        <select id="serviceType" required>
          <option value="">Select Service</option>
          <option value="Basic Support">Basic Support - ₱1,000</option>
          <option value="Standard Setup">Standard Setup - ₱3,500</option>
          <option value="Premium Maintenance">Premium Maintenance - ₱7,000</option>
        </select>
      </div>
      <div class="form-group">
        <label for="orderAmount">Amount (₱)</label>
        <input type="number" id="orderAmount" step="0.01" min="0.01" required readonly>
      </div>
      <button type="submit">Add Order</button>
      <div id="errorMessage" class="error-msg"></div>
    </form>

    <div class="summary-box">
      <h3>Summary</h3>
      <p>Total Orders: <span id="totalOrdersCount">0</span></p>
      <p>Total Revenue: ₱<span id="totalRevenueAmount">0.00</span></p>
      <p>Total Discount Given: ₱<span id="totalDiscountAmount">0.00</span></p>
    </div>

    <h3 class="list-heading">Order List</h3>
    <ul id="orderList"></ul>
  </div>

  <script>
    let nextOrderId = 1;

    class Order {
      constructor(clientName, serviceType, amount, discountRate) {
        this.id = nextOrderId++;
        this.clientName = clientName;
        this.serviceType = serviceType;
        this.amount = amount;
        this.discount = amount * discountRate;
        this.completed = false;
      }

      toggleStatus() {
        this.completed = !this.completed;
      }
    }

    const orders = [];
    const orderForm = document.querySelector('#orderForm');
    const clientNameInput = document.querySelector('#clientName');
    const serviceTypeInput = document.querySelector('#serviceType');
    const orderAmountInput = document.querySelector('#orderAmount');
    const orderList = document.querySelector('#orderList');
    const errorMessage = document.querySelector('#errorMessage');
    const servicePrices = {
      'Basic Support': 1000,
      'Standard Setup': 3500,
      'Premium Maintenance': 7000
    };
    const currency = new Intl.NumberFormat('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    serviceTypeInput.addEventListener('change', () => {
      const price = servicePrices[serviceTypeInput.value];
      orderAmountInput.value = price ? price.toFixed(2) : '';
    });

    function renderOrders() {
      orderList.replaceChildren();

      orders.forEach((order) => {
        const item = document.createElement('li');
        const details = document.createElement('div');
        details.classList.add('order-details');
        if (order.completed) {
          item.classList.add('completed');
        }

        const title = document.createElement('strong');
        title.textContent = `${order.clientName} - ${order.serviceType}`;
        const amount = document.createElement('p');
        amount.textContent = `Amount: ₱${currency.format(order.amount)} | Discount: ₱${currency.format(order.discount)} | Status: ${order.completed ? 'Completed' : 'Active'}`;
        amount.classList.add('order-status');
        details.appendChild(title);
        details.appendChild(amount);

        const actions = document.createElement('div');
        actions.classList.add('item-actions');
        const statusButton = document.createElement('button');
        statusButton.type = 'button';
        statusButton.textContent = order.completed ? 'Reopen' : 'Complete';
        statusButton.addEventListener('click', () => {
          order.toggleStatus();
          renderOrders();
        });

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.textContent = 'Remove';
        deleteButton.classList.add('btn-delete');
        deleteButton.addEventListener('click', () => {
          const orderIndex = orders.findIndex((item) => item.id === order.id);
          if (orderIndex !== -1) {
            orders.splice(orderIndex, 1);
            renderOrders();
          }
        });
        actions.appendChild(statusButton);
        actions.appendChild(deleteButton);
        item.appendChild(details);
        item.appendChild(actions);
        orderList.appendChild(item);
      });

      document.querySelector('#totalOrdersCount').textContent = orders.length;
      const totalRevenue = orders.reduce((total, order) => total + order.amount - order.discount, 0);
      const totalDiscount = orders.reduce((total, order) => total + order.discount, 0);
      document.querySelector('#totalRevenueAmount').textContent = currency.format(totalRevenue);
      document.querySelector('#totalDiscountAmount').textContent = currency.format(totalDiscount);
    }

    orderForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const clientName = clientNameInput.value.trim();
      const serviceType = serviceTypeInput.value;
      const servicePrice = servicePrices[serviceType];
      const amount = Number(orderAmountInput.value);

      if (!clientName || !servicePrice || amount !== servicePrice) {
        errorMessage.textContent = 'Enter a client name and select a service to use its fixed price.';
        errorMessage.style.display = 'block';
        return;
      }

      const previousClientOrders = orders.filter((order) =>
        order.clientName.toLocaleLowerCase() === clientName.toLocaleLowerCase()
      ).length;
      const discountRate = previousClientOrders >= 2 ? 0.1 : 0;
      orders.push(new Order(clientName, serviceType, amount, discountRate));
      errorMessage.textContent = '';
      errorMessage.style.display = 'none';
      orderForm.reset();
      renderOrders();
    });

    renderOrders();
  </script>
</body>
</html>
